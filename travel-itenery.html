<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Schedule - October & November 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --saffron: #FF9933;
            --white: #FFFFFF;
            --green: #138808;
            --navy: #000080;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Tricolor Top Bar */
        .tricolor-bar {
            height: 5px;
            background: linear-gradient(90deg, var(--saffron) 0%, var(--white) 50%, var(--green) 100%);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* National Monuments Watermark Background */
        body::before {
            content: "🏛️ 🛕 🕌 🏰 🇮🇳 🏛️ 🛕 🕌";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 4rem;
            opacity: 0.025;
            pointer-events: none;
            display: flex;
            flex-wrap: wrap;
            gap: 60px;
            justify-content: space-around;
            align-items: center;
            z-index: -1;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 1400px;
        }

        h1 {
            font-size: clamp(1.4rem, 3vw, 2.2rem);
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .app-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1400px;
        }

        /* Month Card Design */
        .month-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .month-card:hover {
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08);
        }

        .month-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--saffron);
        }

        .month-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .tricolor-badge {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot-saffron { background-color: var(--saffron); }
        .dot-white { background-color: #fff; border: 1px solid #cbd5e1; }
        .dot-green { background-color: var(--green); }

        /* Calendar Grid */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background-color: var(--border-color);
            gap: 1px;
            flex-grow: 1;
        }

        .day-name {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 700;
            text-align: center;
            padding: 10px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .day-cell {
            background-color: #ffffff;
            min-height: 105px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }

        .day-cell.empty {
            background-color: #fbfcfd;
        }

        .day-number {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .day-cell.has-events .day-number {
            background-color: #0f172a;
            color: #fff;
        }

        /* Modern Event Badges - Fully Responsive & Wrapped */
        .event-stack {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 600;
            line-height: 1.2;
            width: 100%;
            word-break: break-word;
            overflow-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .badge-travel {
            background-color: #eff6ff;
            color: #1d4ed8;
            border-left: 2.5px solid #3b82f6;
            border-top: 1px solid #bfdbfe;
            border-right: 1px solid #bfdbfe;
            border-bottom: 1px solid #bfdbfe;
        }

        .badge-location {
            background-color: #f0fdf4;
            color: #15803d;
            border-left: 2.5px solid #22c55e;
            border-top: 1px solid #bbf7d0;
            border-right: 1px solid #bbf7d0;
            border-bottom: 1px solid #bbf7d0;
        }

        .badge-activity {
            background-color: #fef2f2;
            color: #b91c1c;
            border-left: 2.5px solid #ef4444;
            border-top: 1px solid #fecaca;
            border-right: 1px solid #fecaca;
            border-bottom: 1px solid #fecaca;
        }

        .badge-icon {
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        .badge-text {
            word-break: break-word;
            overflow-wrap: break-word;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            body {
                padding: 10px 4px;
            }
            .app-container {
                gap: 16px;
            }
            .day-cell {
                min-height: 90px;
                padding: 4px;
            }
            .day-number {
                font-size: 0.7rem;
                width: 18px;
                height: 18px;
            }
            .badge {
                font-size: 0.55rem;
                padding: 2px 4px;
                gap: 2px;
            }
            .day-name {
                font-size: 0.6rem;
                padding: 6px 0;
            }
        }
    </style>
</head>
<body>

<div class="tricolor-bar"></div>

<header>
    <h1><span>🇮🇳</span> October & November 2026 Schedule <span>🏛️</span></h1>
</header>

<div class="app-container">

    <div class="month-card">
        <div class="month-header">
            <span class="month-title">October 2026</span>
            <div class="tricolor-badge">
                <span class="dot dot-saffron"></span>
                <span class="dot dot-white"></span>
                <span class="dot dot-green"></span>
            </div>
        </div>
        <div class="calendar-grid" id="oct-grid">
            <div class="day-name">Sun</div>
            <div class="day-name">Mon</div>
            <div class="day-name">Tue</div>
            <div class="day-name">Wed</div>
            <div class="day-name">Thu</div>
            <div class="day-name">Fri</div>
            <div class="day-name">Sat</div>
        </div>
    </div>

    <div class="month-card">
        <div class="month-header">
            <span class="month-title">November 2026</span>
            <div class="tricolor-badge">
                <span class="dot dot-saffron"></span>
                <span class="dot dot-white"></span>
                <span class="dot dot-green"></span>
            </div>
        </div>
        <div class="calendar-grid" id="nov-grid">
            <div class="day-name">Sun</div>
            <div class="day-name">Mon</div>
            <div class="day-name">Tue</div>
            <div class="day-name">Wed</div>
            <div class="day-name">Thu</div>
            <div class="day-name">Fri</div>
            <div class="day-name">Sat</div>
        </div>
    </div>

</div>

<script>
    const icons = {
        travel: "🚂",
        location: "📍",
        activity: "🎯",
        party: "🎉"
    };

    const octoberData = {
        "4": { travel1: "to Patna", loc1: "Patna Zoo", travel2: "to New Delhi" },
        "6": { activity1: "Learn Driving" },
        "7": { activity1: "Learn Driving" },
        "8": { activity1: "Learn Driving" },
        "9": { travel1: "to Amritsar" },
        "10": { loc1: "Golden Temple", loc2: "Wagah Border" },
        "11": { loc1: "Jallianwala Bagh", travel1: "to New Delhi" },
        "13": { activity1: "Driving Class" },
        "14": { activity1: "Driving Class" },
        "15": { activity1: "Driving Class" },
        "17": { loc1: "Delhi NCR Visit" },
        "18": { loc1: "Delhi NCR Visit" },
        "21": { activity1: "Ishi Birthday", party: "Party Celebration" },
        "23": { travel1: "to Mathura", loc1: "Vrindavan" },
        "24": { loc1: "Bharatpur Bird Sanctuary" },
        "25": { travel1: "to New Delhi" },
        "26": { activity1: "Swimming (Ishi)" },
        "27": { activity1: "Swimming (Ishi)" },
        "28": { activity1: "Swimming (Ishi)" },
        "29": { activity1: "Swimming (Ishi)" },
        "30": { activity1: "Swimming (Ishi)" },
        "31": { activity1: "Swimming (Ishi)" }
    };

    const novemberData = {
        "1": { activity1: "Swimming (Ishi)" },
        "2": { activity1: "Swimming (Ishi)" },
        "3": { activity1: "Swimming (Ishi)" },
        "4": { activity1: "Swimming (Ishi)" },
        "5": { activity1: "Swimming (Ishi)" },
        "6": { travel1: "to Madhepura" }
    };

    function renderMonth(gridId, startDayOfWeek, totalDays, dataSet) {
        const grid = document.getElementById(gridId);

        // Render empty lead cells
        for (let i = 0; i < startDayOfWeek; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day-cell empty';
            grid.appendChild(emptyCell);
        }

        // Render day cells
        for (let day = 1; day <= totalDays; day++) {
            const cell = document.createElement('div');
            const dayKey = `${day}`;
            const data = dataSet[dayKey];

            cell.className = data ? 'day-cell has-events' : 'day-cell';

            const numDiv = document.createElement('div');
            numDiv.className = 'day-number';
            numDiv.innerText = day;
            cell.appendChild(numDiv);

            if (data) {
                const stack = document.createElement('div');
                stack.className = 'event-stack';

                if (data.travel1) stack.appendChild(createBadge('travel', icons.travel, data.travel1));
                if (data.travel2) stack.appendChild(createBadge('travel', icons.travel, data.travel2));
                if (data.loc1) stack.appendChild(createBadge('location', icons.location, data.loc1));
                if (data.loc2) stack.appendChild(createBadge('location', icons.location, data.loc2));
                if (data.activity1) stack.appendChild(createBadge('activity', icons.activity, data.activity1));
                if (data.party) stack.appendChild(createBadge('activity', icons.party, data.party));

                cell.appendChild(stack);
            }

            grid.appendChild(cell);
        }
    }

    function createBadge(type, icon, text) {
        const badge = document.createElement('div');
        badge.className = `badge badge-${type}`;
        badge.innerHTML = `<span class="badge-icon">${icon}</span><span class="badge-text">${text}</span>`;
        return badge;
    }

    window.addEventListener('DOMContentLoaded', () => {
        // Oct 2026 starts on Thursday (index 4), 31 days
        renderMonth('oct-grid', 4, 31, octoberData);
        // Nov 2026 starts on Sunday (index 0), 30 days
        renderMonth('nov-grid', 0, 30, novemberData);
    });
</script>

</body>
</html>
