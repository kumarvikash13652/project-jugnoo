<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Calendar - October & November 2026</title>
    <style>
        :root {
            --saffron: #FF9933;
            --india-green: #138808;
            --navy-blue: #000080;
            --border-color: #e2e8f0;
            --header-bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        /* Tricolor Top Accent Bar */
        .tricolor-bar {
            height: 6px;
            background: linear-gradient(90deg, var(--saffron) 0%, #ffffff 50%, var(--india-green) 100%);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #f4f6f9 100%);
            margin: 0;
            padding: 25px 15px;
            color: #1e293b;
            position: relative;
        }

        /* Subtle National Monument Watermark Background Pattern */
        body::before {
            content: "🏛️ 🇮🇳 🕌 🛕 🏰 🇮🇳 🏛️";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 5rem;
            opacity: 0.023;
            pointer-events: none;
            display: flex;
            flex-wrap: wrap;
            gap: 80px;
            justify-content: space-around;
            align-items: center;
            z-index: -1;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #0f172a;
            margin-top: 15px;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .calendar-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .month-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.08);
            display: flex;
            overflow: hidden;
            width: 100%;
            border: 1px solid rgba(226, 232, 240, 0.8);
            backdrop-filter: blur(10px);
        }

        .month-sidebar {
            background: linear-gradient(180deg, #fff5eb 0%, #fce4ec 100%);
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            text-align: center;
            padding: 20px 10px;
            font-weight: 800;
            font-size: 1.2rem;
            color: #831843;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-right: 2px solid rgba(255, 153, 51, 0.2);
        }

        .month-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - 45px);
        }

        .month-grid-wrapper {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            width: 100%;
        }

        .day-header {
            background-color: var(--header-bg);
            text-align: center;
            padding: 10px 2px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .day-cell {
            min-height: 105px;
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 6px;
            position: relative;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-sizing: border-box;
        }

        .day-cell:nth-child(7n) {
            border-right: none;
        }

        .day-number {
            font-size: 0.85rem;
            font-weight: 700;
            color: #334155;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: transparent;
        }

        .day-cell.has-events .day-number {
            background-color: #f1f5f9;
            color: #0f172a;
            border: 1px solid #cbd5e1;
        }

        .empty-cell {
            background-color: #fafbfc;
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        /* Modern Event Badges with Full Text Wrapping */
        .event-stack {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
        }

        .event-badge {
            display: flex;
            align-items: flex-start;
            gap: 4px;
            padding: 3px 5px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 600;
            white-space: normal;
            word-break: break-word;
            overflow-wrap: break-word;
            line-height: 1.2;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .badge-travel {
            background-color: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            border-left: 3px solid #3b82f6;
        }

        .badge-location {
            background-color: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
            border-left: 3px solid #22c55e;
        }

        .badge-activity {
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-left: 3px solid #ef4444;
        }

        .event-badge span.icon {
            font-size: 0.7rem;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .event-badge span.text {
            word-break: break-word;
            overflow-wrap: break-word;
        }

        /* Mobile Responsiveness Optimizations */
        @media (max-width: 768px) {
            body {
                padding: 10px 5px;
            }
            h1 {
                font-size: 1.3rem;
            }
            .month-sidebar {
                font-size: 0.9rem;
                padding: 15px 6px;
                letter-spacing: 1px;
            }
            .day-cell {
                min-height: 85px;
                padding: 4px;
            }
            .day-number {
                font-size: 0.75rem;
                width: 18px;
                height: 18px;
            }
            .event-badge {
                font-size: 0.55rem;
                padding: 2px 3px;
            }
            .day-header {
                font-size: 0.65rem;
                padding: 6px 0;
            }
        }
    </style>
</head>
<body>

<div class="tricolor-bar"></div>

<h1><span>🇮🇳</span> October & November 2026 Schedule <span>🏛️</span></h1>

<div class="calendar-container">

    <!-- OCTOBER 2026 -->
    <div class="month-card">
        <div class="month-sidebar">October</div>
        <div class="month-content">
            <div class="month-grid-wrapper">
                <div class="day-header">Sun</div>
                <div class="day-header">Mon</div>
                <div class="day-header">Tue</div>
                <div class="day-header">Wed</div>
                <div class="day-header">Thu</div>
                <div class="day-header">Fri</div>
                <div class="day-header">Sat</div>
            </div>
            <div class="month-grid-wrapper" id="oct-grid"></div>
        </div>
    </div>

    <!-- NOVEMBER 2026 -->
    <div class="month-card">
        <div class="month-sidebar">November</div>
        <div class="month-content">
            <div class="month-grid-wrapper">
                <div class="day-header">Sun</div>
                <div class="day-header">Mon</div>
                <div class="day-header">Tue</div>
                <div class="day-header">Wed</div>
                <div class="day-header">Thu</div>
                <div class="day-header">Fri</div>
                <div class="day-header">Sat</div>
            </div>
            <div class="month-grid-wrapper" id="nov-grid"></div>
        </div>
    </div>

</div>

<script>
    const icons = {
        travel: "🚂",
        location: "📍",
        activity: "🎯"
    };

    const octoberData = {
        "4": {
            travel1: "to Patna",
            loc1: "Patna Zoo",
            travel2: "to New Delhi"
        },
        "6": {
            activity1: "Lovely - Learn Driving"
        },
        "7": {
            activity1: "Lovely - Learn Driving"
        },
        "8": {
            activity1: "Lovely - Learn Driving"
        },
        "9": {
            travel1: "to Amritsar"
        },
        "10": {
            loc1: "Golden Temple",
            loc2: "Wagah Border"
        },
        "11": {
            loc1: "Jallianwala Bagh",
            travel1: "to New Delhi"
        },
        "13": {
            activity1: "Complete Driving Class"
        },
        "14": {
            activity1: "Complete Driving Class"
        },
        "15": {
            activity1: "Complete Driving Class"
        },
        "17": {
            loc1: "Delhi NCR Visit"
        },
        "18": {
            loc1: "Delhi NCR Visit"
        },
        "21": {
            activity1: "Ishi Birthday",
            party: "Party Celebration"
        },
        "23": {
            travel1: "to Mathura",
            loc1: "Vrindavan"
        },
        "24": {
            loc1: "Bharatpur Bird Sanctuary"
        },
        "25": {
            travel1: "to New Delhi"
        },
        "26": {
            activity1: "Swimming (Ishi)"
        },
        "27": {
            activity1: "Swimming (Ishi)"
        },
        "28": {
            activity1: "Swimming (Ishi)"
        },
        "29": {
            activity1: "Swimming (Ishi)"
        },
        "30": {
            activity1: "Swimming (Ishi)"
        },
        "31": {
            activity1: "Swimming (Ishi)"
        }
    };

    const novemberData = {
        "1": {
            activity1: "Swimming (Ishi)"
        },
        "2": {
            activity1: "Swimming (Ishi)"
        },
        "3": {
            activity1: "Swimming (Ishi)"
        },
        "4": {
            activity1: "Swimming (Ishi)"
        },
        "5": {
            activity1: "Swimming (Ishi)"
        },
        "6": {
            travel1: "to Madhepura"
        }
    };

    function buildMonth(gridId, startDayOfWeek, totalDays, dataSet = {}) {
        const grid = document.getElementById(gridId);
        
        for (let i = 0; i < startDayOfWeek; i++) {
            const empty = document.createElement('div');
            empty.className = 'empty-cell';
            grid.appendChild(empty);
        }

        for (let day = 1; day <= totalDays; day++) {
            const cell = document.createElement('div');
            const dayKey = `${day}`;
            const dayData = dataSet[dayKey];

            if (dayData) {
                cell.className = 'day-cell has-events';
            } else {
                cell.className = 'day-cell';
            }

            const num = document.createElement('div');
            num.className = 'day-number';
            num.innerText = day;
            cell.appendChild(num);

            if (dayData) {
                const stack = document.createElement('div');
                stack.className = 'event-stack';

                if (dayData.travel1) {
                    stack.appendChild(createBadge('travel', icons.travel, dayData.travel1));
                }
                if (dayData.travel2) {
                    stack.appendChild(createBadge('travel', icons.travel, dayData.travel2));
                }
                if (dayData.loc1) {
                    stack.appendChild(createBadge('location', icons.location, dayData.loc1));
                }
                if (dayData.loc2) {
                    stack.appendChild(createBadge('location', icons.location, dayData.loc2));
                }
                if (dayData.activity1) {
                    stack.appendChild(createBadge('activity', icons.activity, dayData.activity1));
                }
                if (dayData.party) {
                    stack.appendChild(createBadge('activity', "🎉", dayData.party));
                }

                cell.appendChild(stack);
            }

            grid.appendChild(cell);
        }
    }

    function createBadge(type, iconStr, text) {
        const badge = document.createElement('div');
        badge.className = `event-badge badge-${type}`;
        badge.innerHTML = `<span class="icon">${iconStr}</span><span class="text">${text}</span>`;
        return badge;
    }

    window.onload = function() {
        buildMonth('oct-grid', 4, 31, octoberData);
        buildMonth('nov-grid', 0, 30, novemberData);
    };
</script>

</body>
</html>
